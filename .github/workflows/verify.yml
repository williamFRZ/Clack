name: Verificar Clack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mysqlnd
          coverage: none
      - name: Sintaxe e regras de acesso
        run: |
          find . -name '*.php' -not -path './frontend/node_modules/*' -print0 | xargs -0 -n1 php -l
          g++ -std=c++11 -Wall -Wextra -pedantic tests/regras_test.cpp -o /tmp/regras-test
          /tmp/regras-test
      - name: Banco descartável e instalação repetível
        env:
          MYSQL_PWD: test-only-password
        run: |
          mysql -h127.0.0.1 -uroot < Clack_DB.sql
          mysql -h127.0.0.1 -uroot < sql/demo.sql
          printf '%s\n' '<?php return ["db_host"=>"127.0.0.1","db_user"=>"root","db_password"=>"test-only-password","db_name"=>"clack"];' > config/config.local.php
          php sql/migrate.php
          php bin/instalar.php
          php bin/instalar.php
          test "$(mysql -h127.0.0.1 -uroot -N clack -e 'SELECT COUNT(*) FROM usuarios')" = 1
          printf '%s\n' 'test-password-123' | php bin/operador.php admin 'Admin Teste'
      - name: Integração HTTP
        run: |
          php -S 127.0.0.1:8080 > /tmp/clack-php.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -s http://127.0.0.1:8080/api.php; then break; fi
            sleep 1
          done
          python3 tests/gestao_test.py || { cat /tmp/clack-php.log; exit 1; }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code -- painel
      - name: Navegação desktop e mobile (API simulada)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/clack-ui.log 2>&1 &
          node tests/ui_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-painel
          path: /tmp/clack-*.png
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.18
      - name: Compilar configuração fictícia
        env:
          PLATFORMIO_BUILD_FLAGS: -DCLACK_CI
        run: pio run -d esp32
